<h1>Login</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.non_field_errors }}

    <p>
        {{ form.username.label_tag }}
        {{ form.username }}
        {{ form.username.errors }}
    </p>

    <p>
        {{ form.password.label_tag }}
        {{ form.password }}
        {{ form.password.errors }}
    </p>

    <button type="submit">
        Entrar
    </button>

</form>

<a href="{% url 'register' %}">
    Criar conta
</a>
