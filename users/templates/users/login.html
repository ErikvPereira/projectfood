<h1>Login</h1>

<form method="POST">

    {% csrf_token %}

    <input type="text" name="username" placeholder="Usuário">

    <input type="password" name="password" placeholder="Senha">

    <button type="submit">
        Entrar
    </button>

</form>

<a href="{% url 'register' %}">
    Criar conta
</a>
