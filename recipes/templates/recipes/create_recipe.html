{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Receita</title>
</head>

<body>

    <h1>Criar Receita</h1>

    <form method="post">

        {% csrf_token %}

        <div>

            <label for="title">
                Nome da Receita
            </label>

            <br>

            <input
                id="title"
                type="text"
                name="title"
                placeholder="Ex: Bolo de Cenoura"
                required
            >

        </div>

        <hr>

        <section>

            <h2>Ingredientes</h2>

            <p>
                Adicione os ingredientes e suas quantidades.
            </p>

            <div id="ingredients-container">

            </div>

        </section>

        <hr>

        <section>

            <h2>Modo de Preparo</h2>

            <p>
                Descreva os passos da receita.
            </p>

            <div id="steps-container">

            </div>

        </section>

        <hr>

        <div>

            <button type="submit">
                Salvar Receita
            </button>

            <a href="{% url 'home' %}">
                Cancelar Receita
            </a>

        </div>

    </form>

    <script src="{% static 'recipes/create_recipe.js' %}"></script>

</body>

</html>
